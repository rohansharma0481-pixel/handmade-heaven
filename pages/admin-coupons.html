<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Coupon Manager | Seller Admin</title>
  <link rel="stylesheet" href="../css/style.css"/>
  <style>
    .admin-container { max-width: 800px; margin: 3rem auto; padding: 0 1.5rem; }
    .page-title { font-size: 2rem; font-weight: 700; color: var(--ink); margin-bottom: 2rem; font-family: 'Playfair Display', serif; text-align: center; }
    
    .coupon-form { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 2rem; box-shadow: var(--shadow); margin-bottom: 3rem; }
    .form-row { display: flex; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .form-group { flex: 1; min-width: 200px; }
    
    .coupon-list { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); }
    .coupon-table { width: 100%; border-collapse: collapse; text-align: left; }
    .coupon-table th, .coupon-table td { padding: 1rem; border-bottom: 1px solid var(--border); }
    .coupon-table th { background: #f9fafb; font-weight: 600; color: var(--ink); }
    .coupon-table tr:last-child td { border-bottom: none; }
    
    .btn-delete { background: #fee2e2; color: #dc2626; border: 1px solid #fca5a5; padding: 0.3rem 0.75rem; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 600; }
    .btn-delete:hover { background: #fecaca; }
  </style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <div class="header-left">
      <a href="admin.html" class="logo-wrapper">
        <img src="../images/logo.png" alt="Handmade Heaven Logo" class="logo-img" style="height: 60px; width: auto; object-fit: contain;" />
      </a>
      <span style="font-weight:700; font-size:1.2rem; color:var(--primary); margin-left:10px;">Coupon Manager</span>
    </div>
    <div class="header-right">
      <a href="admin.html" class="btn-text">← Back to Dashboard</a>
    </div>
  </div>
</header>

<main class="admin-container">
  <h1 class="page-title">Manage Promo Codes</h1>

  <!-- Add Coupon Form -->
  <div class="coupon-form">
    <h3 style="margin-bottom: 1.5rem; color: var(--ink);">Create New Coupon</h3>
    <form id="add-coupon-form" onsubmit="createCoupon(event)">
      <div class="form-row">
        <div class="form-group">
          <label style="display:block; margin-bottom:0.4rem; font-size:0.85rem; font-weight:600; color:var(--ink);">Coupon Code</label>
          <input type="text" id="coupon-code" class="form-input" required placeholder="E.G. WELCOME10" style="text-transform: uppercase;" />
        </div>
        <div class="form-group">
          <label style="display:block; margin-bottom:0.4rem; font-size:0.85rem; font-weight:600; color:var(--ink);">Discount Type</label>
          <select id="coupon-type" class="form-input" required>
            <option value="fixed">Fixed Amount (₹)</option>
            <option value="percent">Percentage (%)</option>
          </select>
        </div>
      </div>
      
      <div class="form-row">
        <div class="form-group">
          <label style="display:block; margin-bottom:0.4rem; font-size:0.85rem; font-weight:600; color:var(--ink);">Discount Value</label>
          <input type="number" id="coupon-value" class="form-input" required placeholder="100 or 10" min="1" step="0.01" />
        </div>
        <div class="form-group">
          <label style="display:block; margin-bottom:0.4rem; font-size:0.85rem; font-weight:600; color:var(--ink);">Min. Cart Value (₹)</label>
          <input type="number" id="coupon-min" class="form-input" value="0" min="0" step="1" />
        </div>
        <div class="form-group">
          <label style="display:block; margin-bottom:0.4rem; font-size:0.85rem; font-weight:600; color:var(--ink);">Expiry Date (Optional)</label>
          <input type="date" id="coupon-expiry" class="form-input" />
        </div>
      </div>
      
      <button type="submit" class="btn-primary" style="margin-top: 1rem;">Create Coupon</button>
    </form>
  </div>

  <!-- Coupon List -->
  <div class="coupon-list">
    <table class="coupon-table">
      <thead>
        <tr>
          <th>Code</th>
          <th>Type</th>
          <th>Value</th>
          <th>Min Cart</th>
          <th>Expiry</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="coupon-table-body">
        <tr>
          <td colspan="6" style="text-align:center; color:var(--muted);">Loading coupons...</td>
        </tr>
      </tbody>
    </table>
  </div>
</main>

<script>
  // Simple Admin Auth Check
  if (!localStorage.getItem('ac_admin')) {
    alert('Access Denied. Please login via Admin Dashboard.');
    window.location.href = 'admin.html';
  }

  async function loadCoupons() {
    try {
      const res = await fetch('../backend/coupons.php?action=list');
      const data = await res.json();
      
      const tbody = document.getElementById('coupon-table-body');
      if (!data.length) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:var(--muted);">No coupons found.</td></tr>`;
        return;
      }
      
      tbody.innerHTML = data.map(c => `
        <tr>
          <td style="font-weight:700; color:var(--primary);">${c.code}</td>
          <td>${c.type === 'percent' ? 'Percentage' : 'Fixed'}</td>
          <td>${c.type === 'percent' ? c.value + '%' : '₹' + parseFloat(c.value).toFixed(2)}</td>
          <td>₹${parseFloat(c.min_cart_value).toFixed(2)}</td>
          <td>${c.expiry_date || 'Never'}</td>
          <td>
            <button class="btn-delete" onclick="deleteCoupon(${c.id})">Delete</button>
          </td>
        </tr>
      `).join('');
    } catch (e) {
      console.error(e);
    }
  }

  async function createCoupon(e) {
    e.preventDefault();
    const code = document.getElementById('coupon-code').value.trim().toUpperCase();
    const type = document.getElementById('coupon-type').value;
    const value = parseFloat(document.getElementById('coupon-value').value);
    const minCartValue = parseFloat(document.getElementById('coupon-min').value) || 0;
    const expiryDate = document.getElementById('coupon-expiry').value;

    try {
      const res = await fetch('../backend/coupons.php?action=add', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code, type, value, minCartValue, expiryDate })
      });
      const data = await res.json();
      
      if (data.success) {
        alert('Coupon created successfully!');
        document.getElementById('add-coupon-form').reset();
        loadCoupons();
      } else {
        alert(data.error || 'Failed to create coupon.');
      }
    } catch (e) {
      alert('Error connecting to server.');
    }
  }

  async function deleteCoupon(id) {
    if (!confirm('Are you sure you want to delete this coupon?')) return;
    
    try {
      const res = await fetch('../backend/coupons.php?action=delete', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id })
      });
      const data = await res.json();
      
      if (data.success) {
        loadCoupons();
      } else {
        alert(data.error || 'Failed to delete coupon.');
      }
    } catch (e) {
      alert('Error connecting to server.');
    }
  }

  loadCoupons();
</script>
</body>
</html>
