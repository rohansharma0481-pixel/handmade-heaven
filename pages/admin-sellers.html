<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Artisan Manager | Seller Admin</title>
  <link rel="stylesheet" href="../css/style.css"/>
  <style>
    .admin-container { max-width: 800px; margin: 3rem auto; padding: 0 1.5rem; }
    .page-title { font-size: 2rem; font-weight: 700; color: var(--ink); margin-bottom: 2rem; font-family: 'Playfair Display', serif; text-align: center; }
    
    .seller-form { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 2rem; box-shadow: var(--shadow); margin-bottom: 3rem; }
    .form-group { margin-bottom: 1.2rem; }
    
    .seller-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1.5rem; }
    .seller-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; text-align: center; box-shadow: var(--shadow); }
    .seller-img { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; margin-bottom: 1rem; border: 2px solid var(--primary-light); }
    .seller-name { font-size: 1.2rem; font-weight: 700; color: var(--ink); margin-bottom: 0.5rem; }
    .seller-bio { font-size: 0.9rem; color: var(--muted); line-height: 1.4; margin-bottom: 1rem; }
    
    .btn-delete { background: #fee2e2; color: #dc2626; border: 1px solid #fca5a5; padding: 0.3rem 0.75rem; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 600; }
    .btn-delete:hover { background: #fecaca; }
  </style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <div class="header-left">
      <a href="admin.html" class="logo-wrapper">
        <img src="../images/logo.png" alt="Handmade Heaven Logo" class="logo-img" style="height: 60px; width: auto; object-fit: contain;" />
      </a>
      <span style="font-weight:700; font-size:1.2rem; color:var(--primary); margin-left:10px;">Artisan Manager</span>
    </div>
    <div class="header-right">
      <a href="admin.html" class="btn-text">← Back to Dashboard</a>
    </div>
  </div>
</header>

<main class="admin-container">
  <h1 class="page-title">Manage Artisans / Sellers</h1>

  <!-- Add Seller Form -->
  <div class="seller-form">
    <h3 style="margin-bottom: 1.5rem; color: var(--ink);">Add New Artisan</h3>
    <form id="add-seller-form" onsubmit="createSeller(event)">
      <div class="form-group">
        <label style="display:block; margin-bottom:0.4rem; font-size:0.85rem; font-weight:600; color:var(--ink);">Artisan Name</label>
        <input type="text" id="seller-name" class="form-input" required placeholder="E.g. Priya Sharma" />
      </div>
      <div class="form-group">
        <label style="display:block; margin-bottom:0.4rem; font-size:0.85rem; font-weight:600; color:var(--ink);">Bio / Description</label>
        <textarea id="seller-bio" class="form-input" rows="3" placeholder="Tell customers about the artisan..." required></textarea>
      </div>
      <div class="form-group">
        <label style="display:block; margin-bottom:0.4rem; font-size:0.85rem; font-weight:600; color:var(--ink);">Profile Image Path (Optional)</label>
        <input type="text" id="seller-image" class="form-input" placeholder="images/placeholder.jpg" value="images/placeholder.jpg" />
      </div>
      
      <div class="form-group">
        <label style="display:block; margin-bottom:0.4rem; font-size:0.85rem; font-weight:600; color:var(--ink);">Select Products crafted by this Artisan</label>
        <div id="artisan-products-list" style="max-height: 150px; overflow-y: auto; border: 1px solid var(--border); padding: 0.5rem; border-radius: 8px; background: white; margin-bottom: 1rem;">
          <!-- Populated by JS -->
        </div>
      </div>
      
      <button type="submit" class="btn-primary">Add Artisan</button>
    </form>
  </div>

  <!-- Seller List -->
  <h2 style="font-family: 'Playfair Display', serif; margin-bottom: 1.5rem; color: var(--ink);">Current Artisans</h2>
  <div class="seller-list" id="seller-list-container">
    <p style="text-align:center; color:var(--muted); grid-column:1/-1;">Loading artisans...</p>
  </div>
</main>

<script>
  let availableProducts = [];
  async function loadProducts() {
    try {
      const res = await fetch('../backend/products.php?action=get');
      availableProducts = await res.json();
      const list = document.getElementById('artisan-products-list');
      if (list && Array.isArray(availableProducts)) {
        list.innerHTML = availableProducts.map(p => `
          <div style="display:flex; align-items:center; gap:0.5rem; margin-bottom:0.25rem;">
            <input type="checkbox" class="artisan-prod-chk" value="${p.id}" id="prod-${p.id}" style="width:auto; cursor:pointer;" />
            <label for="prod-${p.id}" style="font-size:0.85rem; cursor:pointer; color:var(--ink);">${p.name}</label>
          </div>
        `).join('') || '<p style="font-size:0.8rem; color:var(--muted);">No products available.</p>';
      }
    } catch(e) { console.error(e); }
  }

  // Simple Admin Auth Check
  if (!localStorage.getItem('ac_admin')) {
    alert('Access Denied. Please login via Admin Dashboard.');
    window.location.href = 'admin.html';
  }

  async function loadSellers() {
    try {
      const res = await fetch('../backend/sellers.php?action=get');
      const data = await res.json();
      
      const container = document.getElementById('seller-list-container');
      if (!data.length) {
        container.innerHTML = `<p style="text-align:center; color:var(--muted); grid-column:1/-1;">No artisans found.</p>`;
        return;
      }
      
      container.innerHTML = data.map(s => `
        <div class="seller-card">
          <img src="../${s.image || 'images/placeholder.jpg'}" alt="${s.name}" class="seller-img" />
          <div class="seller-name">${s.name}</div>
          <p class="seller-bio">${s.bio || 'No bio available.'}</p>
          <button class="btn-delete" onclick="deleteSeller(${s.id})">Delete</button>
        </div>
      `).join('');
    } catch (e) {
      console.error(e);
    }
  }

  async function createSeller(e) {
    e.preventDefault();
    const name = document.getElementById('seller-name').value.trim();
    const bio = document.getElementById('seller-bio').value.trim();
    const image = document.getElementById('seller-image').value.trim();

    try {
      const res = await fetch('../backend/sellers.php?action=add', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, bio, image })
      });
      const data = await res.json();
      
      if (data.success) {
        // Link selected products to this new seller ID
        const sellerId = data.id;
        const checkedProds = Array.from(document.querySelectorAll('.artisan-prod-chk:checked')).map(chk => parseInt(chk.value));
        
        if (checkedProds.length > 0) {
          await fetch('../backend/products.php?action=linkArtisan', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ seller_id: sellerId, product_ids: checkedProds })
          });
        }

        alert('Artisan added and products linked successfully!');
        document.getElementById('add-seller-form').reset();
        document.getElementById('seller-image').value = 'images/placeholder.jpg';
        loadSellers();
        loadProducts();
      } else {
        alert(data.error || 'Failed to add artisan.');
      }
    } catch (e) {
      alert('Error connecting to server.');
    }
  }

  async function deleteSeller(id) {
    if (!confirm('Are you sure you want to delete this artisan?')) return;
    
    try {
      const res = await fetch('../backend/sellers.php?action=delete', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id })
      });
      const data = await res.json();
      
      if (data.success) {
        loadSellers();
      } else {
        alert(data.error || 'Failed to delete artisan.');
      }
    } catch (e) {
      alert('Error connecting to server.');
    }
  }

  loadSellers();
  loadProducts();
</script>
</body>
</html>
