<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Queries Dashboard | Handmade Heaven</title>
  <link rel="stylesheet" href="../css/style.css"/>
  <style>
    .admin-container { max-width: 1200px; margin: 3rem auto; padding: 0 1rem; }
    .page-title { font-size: 2rem; font-weight: 700; color: var(--ink); margin-bottom: 2rem; display: flex; align-items: center; gap: 10px; }
    .query-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
    .query-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 1rem; margin-bottom: 1rem; flex-wrap: wrap; gap: 1rem; }
    .query-sender { font-size: 1.1rem; font-weight: 600; color: var(--primary); }
    .query-date { font-size: 0.85rem; color: var(--muted); }
    .query-meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; background: rgba(210, 138, 140, 0.05); padding: 1rem; border-radius: 8px; margin-bottom: 1rem; }
    .meta-block h4 { font-size: 0.8rem; color: var(--muted); margin-bottom: 0.25rem; text-transform: uppercase; letter-spacing: 0.05em; }
    .meta-block p { font-size: 0.95rem; color: var(--ink); font-weight: 500; }
    .query-message { font-size: 1rem; line-height: 1.6; color: var(--ink); background: #f9f9f9; padding: 1rem; border-radius: 8px; border-left: 4px solid var(--primary); }
    .empty-state { text-align: center; padding: 3rem; background: var(--bg-card); border-radius: 12px; border: 1px solid var(--border); }
  </style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <div class="header-left">
      <a href="../index.html" class="logo-wrapper">
        <img src="../images/logo.png" alt="Handmade Heaven Logo" class="logo-img" style="height: 60px; width: auto; object-fit: contain;" />
      </a>
      <span style="font-weight:700; font-size:1.2rem; color:var(--primary); margin-left:10px;">Support Inbox</span>
    </div>
  </div>
</header>

<main class="admin-container">
  <h1 class="page-title">
    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
    Incoming Customer Queries
  </h1>
  
  <div id="queries-list">
    <div class="empty-state">
      <p>Loading support inbox...</p>
    </div>
  </div>
</main>

<script>
  async function loadQueries() {
    try {
      const res = await fetch('../backend/contact.php?action=getAll&t=' + Date.now());
      const data = await res.json();
      
      const listEl = document.getElementById('queries-list');
      
      if (!data || data.length === 0) {
        listEl.innerHTML = `<div class="empty-state"><p>No messages in the inbox.</p></div>`;
        return;
      }
      
      listEl.innerHTML = data.map(q => {
        const queryDate = new Date(q.created_at).toLocaleString('en-IN');
        let threadHTML = '';
        let hasConversation = false;
        
        if (q.conversation) {
            try {
                const thread = JSON.parse(q.conversation);
                if (Array.isArray(thread) && thread.length > 0) {
                    hasConversation = true;
                    threadHTML = thread.map(m => {
                        const isArtisan = m.sender === 'artisan';
                        const senderName = isArtisan ? 'Artisan (You)' : q.name;
                        const alignStyle = isArtisan ? 'margin-left: auto; background: rgba(210, 138, 140, 0.05); border-right: 4px solid var(--primary);' : 'margin-right: auto; background: #f9f9f9; border-left: 4px solid var(--gray);';
                        return `
                            <div style="padding: 0.75rem 1rem; border-radius: 8px; margin-bottom: 0.5rem; max-width: 85%; ${alignStyle}">
                                <strong style="color: ${isArtisan ? 'var(--primary)' : 'var(--ink)'}; font-size: 0.85rem; display: block; margin-bottom: 0.25rem;">${senderName}:</strong>
                                <p style="font-size: 0.95rem; color: var(--ink); line-height: 1.5; margin: 0;">${m.text}</p>
                                ${m.created_at && m.created_at !== 'Legacy' ? `<span style="font-size: 0.65rem; color: var(--muted); display: block; text-align: right; margin-top: 0.4rem;">${new Date(m.created_at).toLocaleString('en-IN')}</span>` : ''}
                            </div>
                        `;
                    }).join('');
                }
            } catch(e) {
                hasConversation = false;
            }
        }
        
        if (!hasConversation) {
            threadHTML = `
                <div style="padding: 0.75rem 1rem; border-radius: 8px; margin-bottom: 0.5rem; max-width: 85%; margin-right: auto; background: #f9f9f9; border-left: 4px solid var(--gray);">
                    <strong style="color: var(--ink); font-size: 0.85rem; display: block; margin-bottom: 0.25rem;">${q.name}:</strong>
                    <p style="font-size: 0.95rem; color: var(--ink); line-height: 1.5; margin: 0;">${q.message}</p>
                </div>
                ${q.reply ? `
                  <div style="padding: 0.75rem 1rem; border-radius: 8px; margin-bottom: 0.5rem; max-width: 85%; margin-left: auto; background: rgba(210, 138, 140, 0.05); border-right: 4px solid var(--primary);">
                    <strong style="color: var(--primary); font-size: 0.85rem; display: block; margin-bottom: 0.25rem;">Artisan (You):</strong>
                    <p style="font-size: 0.95rem; color: var(--ink); line-height: 1.5; margin: 0;">${q.reply}</p>
                  </div>
                ` : ''}
            `;
        }

        return `
          <div class="query-card">
            <div class="query-header">
              <div>
                <span class="query-sender">${q.name}</span>
                <div class="query-date">Received: ${queryDate}</div>
              </div>
            </div>
            
            <div class="query-meta">
              <div class="meta-block">
                <h4>Email Address</h4>
                <p><a href="mailto:${q.email}" style="color:var(--primary); text-decoration:none;">${q.email}</a></p>
              </div>
              <div class="meta-block">
                <h4>Subject</h4>
                <p>${q.subject || '(No Subject)'}</p>
              </div>
            </div>
            
            <div class="query-thread" style="margin-bottom: 1.5rem; display: flex; flex-direction: column; gap: 0.5rem;">
              ${threadHTML}
            </div>

            <div class="reply-section" style="margin-top: 1rem; display: flex; flex-direction: column; gap: 0.5rem;">
              <textarea id="reply-text-${q.id}" placeholder="Type your reply here..." style="width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid var(--border); resize: vertical; min-height: 80px; font-family: inherit; font-size: 0.95rem;"></textarea>
              <button class="btn-action" style="align-self: flex-end; background: var(--primary); color: white; border: none; padding: 0.5rem 1.5rem; border-radius: 6px; font-weight: 600; cursor: pointer;" onclick="sendReply(${q.id})">
                ${q.reply ? 'Update Reply' : 'Send Reply'}
              </button>
            </div>
          </div>
        `;
      }).join('');
      
    } catch (err) {
      document.getElementById('queries-list').innerHTML = `
        <div class="empty-state" style="color:var(--primary);">
          <p>⚠️ Error fetching queries. Please ensure server is running.</p>
        </div>
      `;
    }
  }

  async function sendReply(id) {
    const replyText = document.getElementById(`reply-text-${id}`).value.trim();
    if (!replyText) {
      alert('Please enter a reply.');
      return;
    }

    try {
      const res = await fetch('../backend/contact.php?action=saveReply', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, reply: replyText })
      });
      const data = await res.json();
      if (data.success) {
        alert('Reply saved successfully!');
        loadQueries();
      } else {
        alert('Error: ' + data.error);
      }
    } catch (err) {
      alert('Failed to connect to backend.');
    }
  }

  loadQueries();
  setInterval(loadQueries, 30000);
</script>
</body>
</html>
