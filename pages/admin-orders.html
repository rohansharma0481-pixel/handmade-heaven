<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Orders Dashboard | Handmade Heaven</title>
  <link rel="stylesheet" href="../css/style.css"/>
  <style>
    .admin-container { max-width: 1200px; margin: 3rem auto; padding: 0 1rem; }
    .page-title { font-size: 2rem; font-weight: 700; color: var(--ink); margin-bottom: 2rem; display: flex; align-items: center; gap: 10px; }
    .order-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; margin-bottom: 2rem; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
    .order-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 1rem; margin-bottom: 1rem; flex-wrap: wrap; gap: 1rem; }
    .order-id { font-size: 1.1rem; font-weight: 600; color: var(--primary); }
    .order-date { font-size: 0.85rem; color: var(--muted); }
    .order-status { background: #fef3c7; color: #d97706; padding: 0.25rem 0.75rem; border-radius: 999px; font-size: 0.85rem; font-weight: 600; }
    .customer-info { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; background: rgba(210, 138, 140, 0.05); padding: 1rem; border-radius: 8px; margin-bottom: 1.5rem; }
    .info-block h4 { font-size: 0.8rem; color: var(--muted); margin-bottom: 0.25rem; text-transform: uppercase; letter-spacing: 0.05em; }
    .info-block p { font-size: 0.95rem; color: var(--ink); font-weight: 500; }
    .order-items { margin-bottom: 1rem; }
    .item-row { display: flex; align-items: center; gap: 1rem; padding: 0.75rem 0; border-bottom: 1px dashed var(--border); }
    .item-row:last-child { border-bottom: none; }
    .item-img { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); }
    .item-details { flex: 1; }
    .item-name { font-size: 1rem; font-weight: 600; color: var(--ink); }
    .item-price { font-size: 0.9rem; color: var(--muted); }
    .order-total { text-align: right; font-size: 1.25rem; font-weight: 700; color: var(--ink); margin-top: 1rem; border-top: 1px solid var(--border); padding-top: 1rem; }
    .empty-state { text-align: center; padding: 3rem; background: var(--bg-card); border-radius: 12px; border: 1px solid var(--border); }
  </style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <div class="header-left">
      <a href="../index.html" class="logo-wrapper">
        <img src="../images/logo.png" alt="Handmade Heaven Logo" class="logo-img" style="height: 60px; width: auto; object-fit: contain;" />
      </a>
      <span style="font-weight:700; font-size:1.2rem; color:var(--primary); margin-left:10px;">Seller Dashboard</span>
    </div>
  </div>
</header>

<main class="admin-container">
  <h1 class="page-title">
    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
    Incoming Orders
  </h1>
  
  <div id="orders-list">
    <!-- Orders will be loaded here via JS -->
    <div class="empty-state">
      <p>Loading incoming orders...</p>
    </div>
  </div>
</main>

<script>
  // Helper for currency formatting
  function fmt(n) {
    return new Intl.NumberFormat('en-IN', {
      style: 'currency',
      currency: 'INR',
      minimumFractionDigits: 0
    }).format(n);
  }

  // Fetch all orders
  async function loadOrders() {
    try {
      const res = await fetch('../backend/orders.php?action=getAll&t=' + Date.now());
      const data = await res.json();
      
      const listEl = document.getElementById('orders-list');
      
      if (!data || data.length === 0) {
        listEl.innerHTML = `<div class="empty-state"><p>No orders received yet.</p></div>`;
        return;
      }
      
      listEl.innerHTML = data.map(order => {
        const orderDate = new Date(order.date).toLocaleString('en-IN');
        return `
          <div class="order-card">
            <div class="order-header">
              <div>
                <span class="order-id">Order ID: #${order.id}</span>
                <div class="order-date">${orderDate}</div>
              </div>
              <div style="display:flex; gap:10px; align-items:center;">
                <button class="btn-action" style="background:var(--secondary-light); color:var(--ink); padding:0.45rem 0.8rem; font-size:0.9rem; border:1px solid var(--border); border-radius:6px; cursor:pointer;" onclick="triggerUpload('${order.id}')">
                  📷 Upload Preview
                </button>
                <select id="status-${order.id}" class="sort-select" style="padding: 0.4rem 0.8rem; font-size: 0.9rem; border-color: var(--primary); background: white; border-radius: 6px; cursor: pointer; color: var(--ink); font-weight: 600;" onchange="updateStatus('${order.id}', this.value)">
                  <option value="pending_approval" ${order.status === 'pending_approval' || !order.status ? 'selected' : ''}>Pending Approval</option>
                  <option value="Processing" ${order.status === 'Processing' ? 'selected' : ''}>Processing</option>
                  <option value="Shipped" ${order.status === 'Shipped' ? 'selected' : ''}>Shipped</option>
                  <option value="Out for Delivery" ${order.status === 'Out for Delivery' ? 'selected' : ''}>Out for Delivery</option>
                  <option value="Delivered" ${order.status === 'Delivered' ? 'selected' : ''}>Delivered</option>
                  <option value="Cancelled" ${order.status === 'Cancelled' ? 'selected' : ''}>Cancelled</option>
                </select>
              </div>
            </div>
            
            <div class="customer-info">
              <div class="info-block">
                <h4>Customer Name</h4>
                <p>${order.user_name || 'Guest User'}</p>
              </div>
              <div class="info-block">
                <h4>Contact Info</h4>
                <p>📞 ${order.phone}</p>
                <p style="font-size:0.85rem; color:var(--muted);">${order.user_email || ''}</p>
              </div>
              <div class="info-block">
                <h4>Delivery Address</h4>
                <p>${order.address}</p>
              </div>
              <div class="info-block">
                <h4>Payment Mode</h4>
                <p>💳 ${order.payment_method}</p>
              </div>
            </div>
            
            <div class="order-items">
              ${order.items.map(item => `
                <div class="item-row">
                  <img src="../${item.image}" alt="${item.name}" class="item-img"/>
                  <div class="item-details">
                    <span class="item-name">${item.name}</span>
                    <div class="item-price">Qty: ${item.qty} × ${fmt(item.price)}</div>
                  </div>
                </div>
              `).join('')}
            </div>

            ${order.preview_image ? `
              <div style="margin-top:1rem; margin-bottom:1rem; padding:1rem; background:rgba(180,144,224,0.05); border-radius:8px; border:1px solid var(--border); display:flex; align-items:center; gap:15px;">
                <img src="${order.preview_image}" alt="Preview" style="max-width:100px; max-height:100px; object-fit:cover; border-radius:6px; border:1px solid var(--border);"/>
                <div>
                  <h4 style="font-size:0.8rem; color:var(--muted); text-transform:uppercase; margin-bottom:0.25rem;">Uploaded Preview</h4>
                  <p style="font-size:0.85rem; color:var(--ink); font-weight:500;">Sent to customer for approval.</p>
                </div>
              </div>
            ` : ''}
            
            <div class="order-total">
              Total Bill: ${fmt(order.total)}
            </div>
          </div>
        `;
      }).join('');
      
    } catch (err) {
      document.getElementById('orders-list').innerHTML = `
        <div class="empty-state" style="color:var(--primary);">
          <p>⚠️ Error fetching orders. Please ensure server is running.</p>
        </div>
      `;
    }
  }

  async function updateStatus(orderId, status) {
    try {
      const res = await fetch('../backend/orders.php?action=updateStatus', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ orderId, status })
      });
      const data = await res.json();
      if (data.success) {
        alert('Order status updated! Customer will see "' + status + '" instantly.');
        loadOrders();
      } else {
        alert('Error: ' + data.error);
      }
    } catch (err) {
      alert('Failed to connect to backend.');
    }
  }

  function triggerUpload(orderId) {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    input.onchange = async function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = async function(event) {
          const imgUrl = event.target.result;
          try {
            const res = await fetch('../backend/orders.php?action=updatePreview', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ orderId, previewImage: imgUrl })
            });
            const data = await res.json();
            if (data.success) {
              alert('Preview image uploaded successfully! Customer can now approve.');
              loadOrders();
            } else {
              alert('Upload failed: ' + data.error);
            }
          } catch(err) {
            alert('Error connecting to API.');
          }
        };
        reader.readAsDataURL(file);
      }
    };
    input.click();
  }

  // Auto refresh every 30 seconds
  loadOrders();
  setInterval(loadOrders, 30000);
</script>
</body>
</html>
